rticipação de não controladores é calculada apenas nas controladas consolidadas, pela parcela que não pertence à controladora. Coligadas não geram participação de não controladores no balanço consolidado da controladora."},{"n":79,"text":"A investidora controla a Alfa com 75% de participação e PL de R$ 1.200.000,00. e a Beta com 60% de participação e PL de R$ 700.000,00, Possui ainda coligada Gama com 30% de participação, No balanço consolidado. a participação de acionistas não controladores nas controladas é:","alts":[{"letter":"A","text":"R$ 580.000,00,"},{"letter":"B","text":"R$ 1.320.000,00,"},{"letter":"C","text":"R$ 300.000,00,"},{"letter":"D","text":"R$ 570.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> A participação de não controladores é calculada apenas nas controladas consolidadas, pela parcela que não pertence à controladora. Coligadas não geram participação de não controladores no balanço consolidado da controladora."},{"n":80,"text":"A investidora controla a Alfa com 90% de participação e PL de R$ 800.000,00. e a Beta com 65% de participação e PL de R$ 400.000,00, Possui ainda coligada Gama com 30% de participação, No balanço consolidado. a participação de acionistas não controladores nas controladas é:","alts":[{"letter":"A","text":"R$ 220.000,00,"},{"letter":"B","text":"R$ 980.000,00,"},{"letter":"C","text":"R$ 80.000,00,"},{"letter":"D","text":"R$ 360.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> A participação de não controladores é calculada apenas nas controladas consolidadas, pela parcela que não pertence à controladora. Coligadas não geram participação de não controladores no balanço consolidado da controladora."},{"n":81,"text":"A investidora controla a Alfa com 55% de participação e PL de R$ 1.000.000,00. e a Beta com 85% de participação e PL de R$ 600.000,00, Possui ainda coligada Gama com 30% de participação, No balanço consolidado. a participação de acionistas não controladores nas controladas é:","alts":[{"letter":"A","t ção e PL de R$ 500.000,00, Possui ainda coligada Gama com 30% de participação, No balanço consolidado. a participação de acionistas não controladores nas controladas é:","alts":[{"letter":"A","text":"R$ 280.000,00,"},{"letter":"B","text":"R$ 2.220.000,00,"},{"letter":"C","text":"R$ 160.000,00,"},{"letter":"D","text":"R$ 750.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> A participação de não controladores é calculada apenas nas controladas consolidadas, pela parcela que não pertence à controladora. Coligadas não geram participação de não controladores no balanço consolidado da controladora."},{"n":85,"text":"A investidora controla a Alfa com 70% de participação e PL de R$ 750.000,00. e a Beta com 64% de participação e PL de R$ 350.000,00, Possui ainda coligada Gama com 30% de participação, No balanço consolidado. a participação de acionistas não controladores nas controladas é:","alts":[{"letter":"A","text":"R$ 351.000,00,"},{"letter":"B","text":"R$ 749.000,00,"},{"letter":"C","text":"R$ 225.000,00,"},{"letter":"D","text":"R$ 330.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> A participação de não controladores é calculada apenas nas controladas consolidadas, pela parcela que não pertence à controladora. Coligadas não geram participação de não controladores no balanço consolidado da controladora."},{"n":86,"text":"Uma entidade possui processo com perda provável e valor estimável com confiabilidade. O tratamento contábil é:","alts":[{"letter":"A","text":"reconhecer provisão."},{"letter":"B","text":"divulgar apenas ativo contingente."},{"letter":"C","text":"não reconhecer nem divulgar."},{"letter":"D","text":"reconhecer receita diferida."}],"answer":"A","comment":"<b>Comentário:<\/b> Quando há obrigação presente, saída provável e estimativa confiável, deve-se reconhecer provisão."},{"n":87,"text":"Uma entidade possui processo com perda possível. Segundo a NBC TG 25, o tratamento adequado é:","alts":[{"letter":"A","text":"não reconhecer provisão e divulgar passivo contingente."},{"letter":"B","text":"reconhecer provisão obrigatoriamente."},{"letter":"C","text":"reconhecer ativo contingente."},{"letter":"D","text":"reconhecer reserva no patrimônio líquido."}],"answer":"A","comment":"<b>Comentário:<\/b> Perda possível não gera provisão, mas exige divulgação como passivo contingente, salvo se remota."},{"n":88,"text":"Uma entidade possui chance remota de perda em processo judicial. Nesse caso:","alts":[{"letter":"A","text":"não reconhece provisão e, em regra, não divulga passivo contingente."},{"letter":"B","text":"reconhece provisão integral."},{"letter":"C","text":"reconhece provisão parcial."},{"letter":"D","text":"divulga obrigatoriamente em notas explicativas."}],"answer":"A","comment":"<b>Comentário:<\/b> Quando a chance de saída de recursos é remota, não há provisão e a divulgação é dispensada em regra."},{"n":89,"text":"Um ganho judicial foi avaliado como provável pelos advogados. O ativo contingente deve ser:","alts":[{"letter":"A","text":"não reconhecido, podendo ser divulgado se provável."},{"letter":"B","text":"reconhecido integralmente."},{"letter":"C","text":"reconhecido parcialmente."},{"letter":"D","text":"deduzido do passivo contingente."}],"answer":"A","comment":"<b>Comentário:<\/b> Ativo contingente não é reconhecido antes da realização praticamente certa. Se provável, pode haver divulgação."},{"n":90,"text":"O ativo contingente somente deve ser reconhecido quando:","alts":[{"letter":"A","text":"a realização do ganho for praticamente certa."},{"letter":"B","text":"a chance for possível."},{"letter":"C","text":"a chance for remota."},{"letter":"D","text":"existir pedido judicial, independentemente da chance."}],"answer":"A","comment":"<b>Comentário:<\/b> Ativo contingente não é reconhecido por expectativa provável; reconhecimento ocorre quando a entrada de benefícios se torna praticamente certa."},{"n":91,"text":"Mercadorias foram compradas em janeiro, pagas em março e vendidas em abril. O CMV deve  Bens tangíveis mantidos para uso na produção, administração ou fornecimento de bens e serviços são imobilizado."},{"n":96,"text":"Assinale o item que é conta do patrimônio líquido:","alts":[{"letter":"A","text":"reservas de lucros."},{"letter":"B","text":"fornecedores."},{"letter":"C","text":"empréstimos a pagar."},{"letter":"D","text":"clientes."}],"answer":"A","comment":"<b>Comentário:<\/b> Reservas de lucros compõem o PL. Fornecedores e empréstimos são passivos; clientes é ativo."},{"n":97,"text":"Ações em tesouraria são apresentadas:","alts":[{"letter":"A","text":"como conta redutora do patrimônio líquido."},{"letter":"B","text":"como ativo circulante."},{"letter":"C","text":"como receita financeira."},{"letter":"D","text":"como passivo não circulante."}],"answer":"A","comment":"<b>Comentário:<\/b> Ações em tesouraria reduzem o patrimônio líquido, não representam ativo para fins de apresentação."},{"n":98,"text":"Dividendos obrigatórios a pagar, após formalizada a obrigação, são classificados como:","alts":[{"letter":"A","text":"passivo."},{"letter":"B","text":"patrimônio líquido."},{"letter":"C","text":"ativo."},{"letter":"D","text":"receita."}],"answer":"A","comment":"<b>Comentário:<\/b> Dividendos a pagar representam obrigação presente da entidade perante os sócios."},{"n":99,"text":"Desconto comercial obtido na compra de imobilizado deve:","alts":[{"letter":"A","text":"reduzir o custo do ativo."},{"letter":"B","text":"ser reconhecido como receita financeira."},{"letter":"C","text":"ser reconhecido como reserva de capital."},{"letter":"D","text":"ser registrado como passivo."}],"answer":"A","comment":"<b>Comentário:<\/b> O custo do ativo é mensurado líquido de descontos comerciais e abatimentos."},{"n":100,"text":"Frete necessário para levar equipamento ao local de uso deve:","alts":[{"letter":"A","text":"compor o custo do imobilizado."},{"letter":"B","text":"ser sempre despesa financeira."},{"letter":"C","text":"ser perda do período."},{"letter":"D","text": function save(){write('idx',idx);write('answers',answers);write('checked',checked);write('checkpoint',shownCheckpoint);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beep(good){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const t=ctx.currentTime;[0,.11].forEach((d,j)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=good?(j?830:660):(j?220:330);gain.gain.setValueAtTime(.08,t+d);gain.gain.exponentialRampToValueAtTime(.001,t+d+.17);o.connect(gain);gain.connect(ctx.destination);o.start(t+d);o.stop(t+d+.18)});setTimeout(()=>ctx.close(),550)}catch(e){}}
function stats(){let correct=0,wrong=0,answered=0,confirmed=0;QUESTIONS.forEach(q=>{if(answers[q.n])answered++;if(checked[q.n]&&answers[q.n]){confirmed++;if(answers[q.n]===q.answer)correct++;else wrong++}});return {correct,wrong,answered,confirmed,pct:(correct/QUESTIONS.length*100).toFixed(1).replace('.',',')}}
function render(){const q=QUESTIONS[idx],done=!!checked[q.n],selected=answers[q.n]||'',st=stats();$('position').textContent=`Questão ${idx+1}/${QUESTIONS.length} · Nº ${q.n}`;$('qbadge').textContent=`QUESTÃO ${q.n}`;$('range').textContent=`${QUESTIONS.length} questões`;$('statement').textContent=q.text;$('bar').style.width=(st.confirmed/QUESTIONS.length*100)+'%';$('counter').textContent=`Acertos: ${st.correct} · Erros: ${st.wrong}`;
$('choices').innerHTML=q.alts.map(a=>{const cls=done?(a.letter===q.answer?'correct':a.letter===selected?'wrong':''):(a.letter===selected?'selected':'');return `<button class="answer ${cls}" data-a="${esc(a.letter)}" ${done?'disabled':''}><span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`}).join('');
$('choices').querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{if(checked[q.n])return;answers[q.n]=btn.dataset.a;save();render()});
$('feedbackArea').innerHTML=done?`<div class="feedback"><div class="${selected===q.answer?'resultgood':'resultbad'}">${selected===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'} Gabarito: ${esc(q.answer)}</div><div style="margin-top:12px">${q.comment}</div></div>`:'';
$('checkbtn').textContent=done?'✓ Resposta conferida':'Conferir resposta';$('checkbtn').disabled=done||!selected;$('checkbtn').style.opacity=(done||!selected)?'.65':'1';$('prev').disabled=idx===0;$('next').textContent=idx===QUESTIONS.length-1?'Ver resultado ▶':'Avançar ▶';
$('grid').innerHTML=QUESTIONS.map((x,j)=>`<button class="${checked[x.n]?'done':''} ${j===idx?'current':''}" data-j="${j}" aria-label="Questão ${x.n}">${x.n}</button>`).join('');$('grid').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.j)));
if(st.confirmed>=10&&st.confirmed%10===0&&st.confirmed>shownCheckpoint){shownCheckpoint=st.confirmed;save();$('checkpoint').classList.remove('hidden');$('checkpoint').innerHTML=`<div class="checktext">📊 Parcial de ${st.confirmed} questões conferidas</div>Acertos: ${st.correct} · Erros: ${st.wrong} · Aproveitamento parcial: ${(st.correct/st.confirmed*100).toFixed(1).replace('.',',')}%`;}else{$('checkpoint').classList.add('hidden')}
}
function check(){const q=QUESTIONS[idx];if(!answers[q.n]||checked[q.n])return;checked[q.n]=true;save();beep(answers[q.n]===q.answer);render()}
function jump(j){idx=Math.max(0,Math.min(QUESTIONS.length-1,j));save();$('final').classList.add('hidden');render();window.scrollTo({top:0,behavior:'instant'})}
function advance(){if(idx===QUESTIONS.length-1){showFinal();return}jump(idx+1)}
function showFinal(){const st=stats(),box=$('final');box.classList.remove('hidden');box.innerHTML=`<h2>RESULTADO — QUIZ ${QUIZ}</h2><div class="summary"><b>Questões:</b> ${QUESTIONS.length}<br><b>Conferidas:</b> ${st.confirmed}<br><b>Acertos:</b> <span class="resultgood">${st.correct}</span><br><b>Erros:</b> <span class="resultbad">${st.wrong}</span><br><b>Aproveitamento geral:</b> ${st.pct}%</div><p class="muted">Questões ainda não conferidas são consideradas sem acerto no percentual geral.</p><label for="studentName"><b>Nome do aluno (opcional):</b></label><div><input class="name" id="studentName" maxlength="90" placeholder="Digite seu nome" value="${esc(name)}"></div><div class="actions"><button class="primary" id="share">Enviar resultado pelo WhatsApp</button><button class="secondary" id="back">Voltar às questões</button></div>`;box.querySelector('#studentName').oninput=e=>{name=e.target.value;write('name',name)};box.querySelector('#back').onclick=()=>{box.classList.add('hidden');window.scrollTo({top:0,behavior:'instant'})};box.querySelector('#share').onclick=()=>{const s=stats(),message=`Curso de Contabilidade Professor Moreira%0AQuiz ${QUIZ} — Modo Aluno%0AAluno: ${encodeURIComponent(name||'Não informado')}%0AConferidas: ${s.confirmed}/${QUESTIONS.length}%0AAcertos: ${s.correct}%0AErros: ${s.wrong}%0AAproveitamento: ${s.pct}%25`;window.open('https://wa.me/5561985323574?text='+message,'_blank','noopener,noreferrer')};box.scrollIntoView({behavior:'smooth',block:'start'})}
$('checkbtn').onclick=check;$('prev').onclick=()=>jump(idx-1);$('next').onclick=advance;$('finish').onclick=showFinal;
$('restart').onclick=()=>{if(!confirm('Deseja reiniciar todas as respostas deste quiz?'))return;idx=0;answers={};checked={};shownCheckpoint=0;save();$('final').classList.add('hidden');render();window.scrollTo(0,0)};render();
</script></body></html>
